name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # Style, gem and JS audits, Brakeman, tests and seeds — the same
      # steps bin/ci runs locally. See config/ci.rb.
      - name: Run CI
        env:
          RAILS_ENV: test
        run: bin/ci
