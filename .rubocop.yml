# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Loads every cop under lib/rubocop/cop.
require:
  - ./lib/rubocop/schema.rb
  - ./lib/rubocop/model.rb
  - ./lib/rubocop/vocabulary.rb
  - ./lib/rubocop/service.rb
  - ./lib/rubocop/controller.rb

# House rules for the schema, documented at the top of each cop: a nullable
# column and a database default each put a second, invisible answer next to
# the model's.
#
# Migrations copied in from an engine (`*.active_storage.rb` and the like) are
# excluded. They are not ours to edit, so holding them to a house rule would
# only ever mean a red build.
Schema/NoNullableColumns:
  Enabled: true
  Include:
    - "db/migrate/*.rb"
  Exclude:
    - "db/migrate/*.*.rb"

Schema/NoColumnDefaults:
  Enabled: true
  Include:
    - "db/migrate/*.rb"
  Exclude:
    - "db/migrate/*.*.rb"

# A callback hides work behind `save`: the caller reads one method and gets
# several, in an order nothing states. Concerns are included into models, so
# they are held to the same rule.
Model/NoCallbacks:
  Enabled: true
  Include:
    - "app/models/**/*.rb"

# Every argument of a service is type-checked where it arrives. Scoped by base
# class rather than by folder, so the whole of app/ is offered to it and the cop
# decides; a service stays covered wherever it is filed.
Service/NoUnguardedArguments:
  Enabled: true
  Include:
    - "app/**/*.rb"

# Untrusted input is parsed at the seam, by the parsers that bounce bad input and
# read a time in the requester's zone rather than the server's.
Controller/NoInlineParamParse:
  Enabled: true
  Include:
    - "app/controllers/**/*.rb"

# A raw parameter reaching a record: Active Record coerces the string, so
# `find(params[:id])` serves record 1 for `1abc` and nothing fails. The parsers
# cannot defend a door nobody opened.
Controller/NoUnparsedLookup:
  Enabled: true
  Include:
    - "app/controllers/**/*.rb"

# No industry vocabulary in code. Applied from the start rather than ratcheted
# down later, because this tree is new and can simply not acquire the debt.
#
# Every term is listed with its plural: matching is case-insensitive but not
# inflecting, so `member` does not cover `members`. Add both, always.
#
# `test/` is exempt: a fixture has to be free to name the thing whose ban it is
# proving. The fixtures are swept to neutral nouns anyway, and the cop's own
# tests use an invented term (`widget`), so the exemption is headroom rather
# than a hiding place.
Vocabulary/BannedTerms:
  Enabled: true
  Include:
    - "app/**/*.rb"
    - "db/**/*.rb"
    - "lib/**/*.rb"
  BannedTerms:
    - member
    - members
    - club
    - clubs
    - league
    - leagues
    - game
    - games
    - rating
    - ratings
    - team
    - teams

# Fights Schema/NoNullableColumns: it wants a default alongside NOT NULL
# so the migration survives a populated table. Add the column nullable,
# fill it and promote it with `change_column_null` instead.
Rails/NotNullColumn:
  Enabled: false
