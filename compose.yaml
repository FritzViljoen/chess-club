services:
  web:
    build: .
    ports:
      - "${PORT:-3000}:80"
    environment:
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE, see README}
      DATABASE_PATH: /rails/storage/production.sqlite3
      # Plain HTTP here. Left on, every write redirects to an https:// port that
      # is not listening.
      RAILS_ASSUME_SSL: ${RAILS_ASSUME_SSL:-false}
      RAILS_FORCE_SSL: ${RAILS_FORCE_SSL:-false}
      # A real club starts with its own people, not the demo fourteen.
      SEED_ON_FIRST_BOOT: ${SEED_ON_FIRST_BOOT:-false}
    volumes:
      # SQLite lives on disk. Without this the board is lost on every redeploy.
      - storage:/rails/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  storage:
